name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy ahbarandco to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GH_PAT
          script: |
            set -e

            echo "📦 Pulling latest code..."
            cd /opt/ahbarandco

            # First deploy: git init in the existing dir (avoids clone failing on non-empty dir)
            # Subsequent deploys: just git pull
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://x-access-token:${GH_PAT}@github.com/ahbarajaib/ahbarandco.git
              git fetch origin main
              git checkout -f -B main origin/main
            else
              git remote set-url origin https://x-access-token:${GH_PAT}@github.com/ahbarajaib/ahbarandco.git
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "🔒 Checking .env file..."
            if [ ! -f ".env" ]; then
              echo "❌ ERROR: /opt/ahbarandco/.env not found! Create it on the VPS first."
              exit 1
            fi

            echo "🐳 Rebuilding and restarting containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "⏳ Waiting for app to be healthy (30s)..."
            sleep 30

            echo "🔄 Running database migrations..."
            # docker compose reads .env automatically — no need to pass DATABASE_URL manually
            docker compose -f docker-compose.prod.yml run --rm --no-deps migrate

            echo "✅ Running health check..."
            if ! curl -sf http://127.0.0.1:3000 -o /dev/null; then
              echo "❌ Health check failed! Verbose connection details:"
              curl -iv http://127.0.0.1:3000 || true
              echo "=== app container logs ==="
              docker compose -f docker-compose.prod.yml logs --tail 100 app || true
              echo "=== db container logs ==="
              docker compose -f docker-compose.prod.yml logs --tail 100 db || true
              echo "=== migrate container logs ==="
              docker compose -f docker-compose.prod.yml logs --tail 100 migrate || true
              exit 1
            fi

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "🎉 Deployment complete! ahbarandco is live."
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
