name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to the project directory
            cd /var/www/ahbarandco
            
            # Pull the latest code changes
            git pull origin main
            
            # Rebuild the standalone Next.js App image (database remains active)
            docker compose build --no-cache app
            
            # Update and replace only the app container with near-zero downtime
            docker compose up -d --no-deps app
            
            # Run database push to apply new migrations/schema updates automatically
            docker compose exec -T app npx prisma db push
            
            # Clean up old unused builder/cache images to prevent disk fillup
            docker image prune -f
