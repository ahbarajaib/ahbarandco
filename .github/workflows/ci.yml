name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Dummy values — build must not contact real services
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          AUTH_SECRET: "dummy-secret-for-ci-build-only-32chars!!"
          NEXTAUTH_URL: "http://localhost:3000"
          GOOGLE_CLIENT_ID: "dummy"
          GOOGLE_CLIENT_SECRET: "dummy"
          RAZORPAY_KEY_ID: "rzp_test_dummy"
          RAZORPAY_KEY_SECRET: "dummy"
          RAZORPAY_WEBHOOK_SECRET: "dummy"
          NEXT_PUBLIC_RAZORPAY_KEY_ID: "rzp_test_dummy"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          SMTP_HOST: "smtp.dummy.com"
          SMTP_PORT: "587"
          SMTP_USER: "dummy"
          SMTP_PASSWORD: "dummy"
          SMTP_FROM: "dummy@dummy.com"
