services:
  db:
    image: postgres:16-alpine
    container_name: ahbarandco-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ahbar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ahbar}
      POSTGRES_DB: ${POSTGRES_DB:-ahbarandco}
    ports:
      # Expose only to localhost (127.0.0.1) for secure administrative access (e.g. pgAdmin/DBeaver via SSH tunnel)
      # This prevents direct access from the public internet.
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ahbar} -d ${POSTGRES_DB:-ahbarandco}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahbarandco-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent named volume to keep uploaded images safe across container rebuilds/redeploys
      - uploads_data:/app/public/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ahbar}:${POSTGRES_PASSWORD:-ahbar}@db:5432/${POSTGRES_DB:-ahbarandco}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
